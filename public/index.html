<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;700&family=Poppins:wght@400;600&family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
    
    <meta name="description" content="3dpstl is your premier destination for premium 3d printing products. Shop high-quality 3d printing gear, toys, and essentials with delivery to your door.">
    
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0d0d33" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="3DSTL" />
    <meta name="application-name" content="3DSTL" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Language + direction before anything paints: Arabic flips the page right-to-left (admin pages stay left-to-right) -->
    <script>
      (function () {
        var lang = null;
        try { lang = localStorage.getItem('lang'); } catch (e) {}
        if (lang !== 'ar' && lang !== 'en') {
          var langs = (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || 'en']);
          lang = String(langs[0] || 'en').toLowerCase().indexOf('ar') === 0 ? 'ar' : 'en';
        }
        var rtl = lang === 'ar';
        var theme = null;
        try { theme = localStorage.getItem('theme'); } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.setAttribute('data-bs-theme', theme);
        var tc = document.querySelector('meta[name="theme-color"]');
        if (tc && theme === 'light') tc.setAttribute('content', '#f6f5ff');
        document.documentElement.lang = lang;
        document.documentElement.dir = rtl ? 'rtl' : 'ltr';
        document.write('<link id="bs-css" rel="stylesheet" href="%PUBLIC_URL%/vendor/bootstrap/bootstrap' + (rtl ? '.rtl' : '') + '.min.css">');
      })();
    </script>

    <title>3DSTL | Premium 3d Printing Products</title>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "3DSTL",
        "url": "https://www.3dpstl.com",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://www.3dpstl.com/search?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
  </head>
  <body>

      <div style="padding: 20px; text-align: center;">
        <h1>3dpstl - Premium 3d Printing Products</h1>
        <p>Shop the best selection of 3d printing gear, toys, and essentials. High-quality products delivered to your door. Please enable JavaScript to view our full catalog.</p>
      </div>
    </noscript>

    <div id="root"></div>
  </body>
</html>
